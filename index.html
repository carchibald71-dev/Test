<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #eee;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 4px;
      color: #e94560;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .score-box {
      background: #16213e;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      min-width: 90px;
    }

    .score-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #aaa;
    }

    .score-box.x .symbol { color: #e94560; }
    .score-box.o .symbol { color: #0f3460; background: #53d8fb; border-radius: 50%; }
    .score-box .symbol {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .score-box .count {
      font-size: 1.8rem;
      font-weight: bold;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      height: 1.6rem;
      color: #ccc;
    }

    #status span {
      font-weight: bold;
    }

    .x-turn { color: #e94560; }
    .o-turn { color: #53d8fb; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
      margin: 0 auto 1.5rem;
      width: fit-content;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #53d8fb; }

    .cell.win {
      background: #0f3460;
      box-shadow: 0 0 16px rgba(83, 216, 251, 0.5);
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button {
      padding: 0.6rem 1.6rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: scale(1.03); }

    #restart-btn {
      background: #e94560;
      color: #fff;
    }

    #reset-score-btn {
      background: #16213e;
      color: #aaa;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TIC-TAC-TOE</h1>

    <div class="scoreboard">
      <div class="score-box x">
        <div class="label">Player 1</div>
        <div class="symbol">X</div>
        <div class="count" id="score-x">0</div>
      </div>
      <div class="score-box" style="min-width:60px;">
        <div class="label">Draws</div>
        <div class="symbol" style="color:#aaa">—</div>
        <div class="count" id="score-draw">0</div>
      </div>
      <div class="score-box o">
        <div class="label">Player 2</div>
        <div class="symbol" style="background:none;color:#53d8fb">O</div>
        <div class="count" id="score-o">0</div>
      </div>
    </div>

    <div id="status"></div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="buttons">
      <button id="restart-btn">New Game</button>
      <button id="reset-score-btn">Reset Score</button>
    </div>
  </div>

  <script>
    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');
    const scoreX = document.getElementById('score-x');
    const scoreO = document.getElementById('score-o');
    const scoreDraw = document.getElementById('score-draw');

    const WIN_LINES = [
      [0,1,2],[3,4,5],[6,7,8], // rows
      [0,3,6],[1,4,7],[2,5,8], // cols
      [0,4,8],[2,4,6]          // diagonals
    ];

    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0, draw: 0 };

    function setStatus(msg, cls) {
      status.innerHTML = msg;
      status.className = cls || '';
    }

    function updateTurnStatus() {
      const cls = currentPlayer === 'X' ? 'x-turn' : 'o-turn';
      setStatus(`<span class="${cls}">Player ${currentPlayer === 'X' ? '1 (X)' : '2 (O)'}</span>'s turn`, cls);
    }

    function checkWinner() {
      for (const [a, b, c] of WIN_LINES) {
        if (board[a] && board[a] === board[b] && board[b] === board[c]) {
          return { winner: board[a], line: [a, b, c] };
        }
      }
      if (board.every(v => v)) return { winner: null, draw: true };
      return null;
    }

    function handleClick(e) {
      const idx = +e.target.dataset.index;
      if (gameOver || board[idx]) return;

      board[idx] = currentPlayer;
      e.target.textContent = currentPlayer;
      e.target.classList.add('taken', currentPlayer.toLowerCase());

      const result = checkWinner();
      if (result) {
        gameOver = true;
        if (result.winner) {
          result.line.forEach(i => cells[i].classList.add('win'));
          scores[result.winner]++;
          scoreX.textContent = scores.X;
          scoreO.textContent = scores.O;
          const cls = result.winner === 'X' ? 'x-turn' : 'o-turn';
          setStatus(`<span class="${cls}">Player ${result.winner === 'X' ? '1 (X)' : '2 (O)'} wins!</span>`, cls);
        } else {
          scores.draw++;
          scoreDraw.textContent = scores.draw;
          setStatus('It\'s a draw!');
        }
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateTurnStatus();
      }
    }

    function restart() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
      updateTurnStatus();
    }

    cells.forEach(cell => cell.addEventListener('click', handleClick));
    document.getElementById('restart-btn').addEventListener('click', restart);
    document.getElementById('reset-score-btn').addEventListener('click', () => {
      scores = { X: 0, O: 0, draw: 0 };
      scoreX.textContent = 0;
      scoreO.textContent = 0;
      scoreDraw.textContent = 0;
      restart();
    });

    updateTurnStatus();
  </script>
</body>
</html>
