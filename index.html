<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #eee;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 4px;
      color: #e94560;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .score-box {
      background: #16213e;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      min-width: 90px;
    }

    .score-box .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #aaa;
    }

    .score-box.x .symbol { color: #e94560; }
    .score-box.o .symbol { color: #0f3460; background: #53d8fb; border-radius: 50%; }
    .score-box .symbol {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .score-box .count {
      font-size: 1.8rem;
      font-weight: bold;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      height: 1.6rem;
      color: #ccc;
    }

    #status span {
      font-weight: bold;
    }

    .x-turn { color: #e94560; }
    .o-turn { color: #53d8fb; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
      margin: 0 auto 1.5rem;
      width: fit-content;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #53d8fb; }

    .cell.win {
      background: #0f3460;
      box-shadow: 0 0 16px rgba(83, 216, 251, 0.5);
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button {
      padding: 0.6rem 1.6rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: scale(1.03); }

    #restart-btn {
      background: #e94560;
      color: #fff;
    }

    #reset-score-btn {
      background: #16213e;
      color: #aaa;
      border: 1px solid #333;
    }

    /* ── Lab popup ── */
    #lab-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    #lab-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    #lab-card {
      background: #16213e;
      border-radius: 20px;
      padding: 1.2rem 1.4rem 1rem;
      max-width: 320px;
      width: 90vw;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      transform: scale(0.85);
      transition: transform 0.25s;
    }

    #lab-overlay.show #lab-card {
      transform: scale(1);
    }

    #lab-verdict {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.7rem;
      line-height: 1.3;
    }

    #lab-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      background: #0f3460;
    }

    #lab-caption {
      margin-top: 0.7rem;
      font-size: 0.9rem;
      color: #aaa;
      font-style: italic;
    }

    #lab-close {
      margin-top: 0.9rem;
      background: #e94560;
      color: #fff;
      padding: 0.5rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    #lab-close:hover { opacity: 0.85; }

    .rating-good { color: #4cff91; }
    .rating-mid  { color: #f0c040; }
    .rating-bad  { color: #ff6060; }
  </style>
</head>
<body>
  <div class="container">
    <h1>TIC-TAC-TOE</h1>

    <div class="scoreboard">
      <div class="score-box x">
        <div class="label">Player 1</div>
        <div class="symbol">X</div>
        <div class="count" id="score-x">0</div>
      </div>
      <div class="score-box" style="min-width:60px;">
        <div class="label">Draws</div>
        <div class="symbol" style="color:#aaa">—</div>
        <div class="count" id="score-draw">0</div>
      </div>
      <div class="score-box o">
        <div class="label">Player 2</div>
        <div class="symbol" style="background:none;color:#53d8fb">O</div>
        <div class="count" id="score-o">0</div>
      </div>
    </div>

    <div id="status"></div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="buttons">
      <button id="restart-btn">New Game</button>
      <button id="reset-score-btn">Reset Score</button>
    </div>
  </div>

  <!-- Lab popup -->
  <div id="lab-overlay">
    <div id="lab-card">
      <div id="lab-verdict"></div>
      <img id="lab-img" src="" alt="A very opinionated Labrador">
      <div id="lab-caption"></div>
      <br>
      <button id="lab-close">OK, got it</button>
    </div>
  </div>

  <script>
    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');
    const scoreX = document.getElementById('score-x');
    const scoreO = document.getElementById('score-o');
    const scoreDraw = document.getElementById('score-draw');

    const WIN_LINES = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0, draw: 0 };

    // ── Move rating ──────────────────────────────────────────────
    const RATINGS = {
      win: {
        cls: 'rating-good',
        verdicts: ['WINNING MOVE!', 'GENIUS PLAY!', 'UNSTOPPABLE!'],
        captions: [
          'The Lab is going absolutely berserk with excitement.',
          'This dog has never been prouder of a human.',
          'Maximum tail wags. Maximum zoomies. Outstanding.',
        ]
      },
      block: {
        cls: 'rating-good',
        verdicts: ['NICE BLOCK!', 'GOOD DEFENCE!', 'WELL SPOTTED!'],
        captions: [
          'The Lab gives an approving head-tilt.',
          'A solid defensive play. The dog is cautiously impressed.',
          'Smart. The Lab rewards you with a single bork.',
        ]
      },
      center: {
        cls: 'rating-good',
        verdicts: ['BOLD CHOICE!', 'CLASSIC OPENER!', 'STRATEGIC!'],
        captions: [
          'The Lab nods wisely. The center is always a good call.',
          'Classic. The Lab would have done the same.',
          'Textbook move. The dog approves.',
        ]
      },
      corner: {
        cls: 'rating-mid',
        verdicts: ['DECENT MOVE.', 'NOT BAD.', 'OKAY, SURE.'],
        captions: [
          'The Lab sniffs the air thoughtfully.',
          'Could be worse. The dog reserves judgement.',
          'The Lab tilts its head. Jury is still out.',
        ]
      },
      edge: {
        cls: 'rating-bad',
        verdicts: ['YIKES.', 'REALLY?', 'THE EDGE?? BOLD.'],
        captions: [
          'The Lab looks genuinely concerned for you.',
          'The dog stares at you with quiet disappointment.',
          'Edges are the Lab\'s least favourite squares. Just saying.',
        ]
      }
    };

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function wouldWin(b, idx, player) {
      const copy = [...b];
      copy[idx] = player;
      return WIN_LINES.some(([a, x, c]) => copy[a] === player && copy[x] === player && copy[c] === player);
    }

    function rateMove(idx, player) {
      if (wouldWin(board, idx, player)) return RATINGS.win;
      const opp = player === 'X' ? 'O' : 'X';
      if (wouldWin(board, idx, opp)) return RATINGS.block;
      if (idx === 4) return RATINGS.center;
      if ([0,2,6,8].includes(idx)) return RATINGS.corner;
      return RATINGS.edge;
    }

    // ── Lab popup ────────────────────────────────────────────────
    const overlay  = document.getElementById('lab-overlay');
    const labImg   = document.getElementById('lab-img');
    const verdict  = document.getElementById('lab-verdict');
    const caption  = document.getElementById('lab-caption');
    const closeBtn = document.getElementById('lab-close');

    closeBtn.addEventListener('click', () => overlay.classList.remove('show'));
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });

    function showLab(rating) {
      verdict.textContent = pick(rating.verdicts);
      verdict.className = 'rating-cls ' + rating.cls;
      caption.textContent = pick(rating.captions);
      labImg.src = '';

      fetch('https://dog.ceo/api/breed/labrador/images/random')
        .then(r => r.json())
        .then(data => { labImg.src = data.message; })
        .catch(() => { labImg.src = ''; });  // show blank if fetch fails

      overlay.classList.add('show');
    }

    // ── Game logic ───────────────────────────────────────────────
    function setStatus(msg, cls) {
      status.innerHTML = msg;
      status.className = cls || '';
    }

    function updateTurnStatus() {
      const cls = currentPlayer === 'X' ? 'x-turn' : 'o-turn';
      setStatus(`<span class="${cls}">Player ${currentPlayer === 'X' ? '1 (X)' : '2 (O)'}</span>'s turn`, cls);
    }

    function checkWinner() {
      for (const [a, b, c] of WIN_LINES) {
        if (board[a] && board[a] === board[b] && board[b] === board[c]) {
          return { winner: board[a], line: [a, b, c] };
        }
      }
      if (board.every(v => v)) return { winner: null, draw: true };
      return null;
    }

    function handleClick(e) {
      const idx = +e.target.dataset.index;
      if (gameOver || board[idx]) return;

      const rating = rateMove(idx, currentPlayer);

      board[idx] = currentPlayer;
      e.target.textContent = currentPlayer;
      e.target.classList.add('taken', currentPlayer.toLowerCase());

      const result = checkWinner();
      if (result) {
        gameOver = true;
        if (result.winner) {
          result.line.forEach(i => cells[i].classList.add('win'));
          scores[result.winner]++;
          scoreX.textContent = scores.X;
          scoreO.textContent = scores.O;
          const cls = result.winner === 'X' ? 'x-turn' : 'o-turn';
          setStatus(`<span class="${cls}">Player ${result.winner === 'X' ? '1 (X)' : '2 (O)'} wins!</span>`, cls);
        } else {
          scores.draw++;
          scoreDraw.textContent = scores.draw;
          setStatus("It's a draw!");
        }
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateTurnStatus();
      }

      showLab(rating);
    }

    function restart() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
      updateTurnStatus();
    }

    cells.forEach(cell => cell.addEventListener('click', handleClick));
    document.getElementById('restart-btn').addEventListener('click', restart);
    document.getElementById('reset-score-btn').addEventListener('click', () => {
      scores = { X: 0, O: 0, draw: 0 };
      scoreX.textContent = 0;
      scoreO.textContent = 0;
      scoreDraw.textContent = 0;
      restart();
    });

    updateTurnStatus();
  </script>
</body>
</html>
